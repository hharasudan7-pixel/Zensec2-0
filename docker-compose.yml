version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - ES_HOST=elasticsearch
    depends_on:
      - postgres
      - elasticsearch
    
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=zentrasec
      - POSTGRES_PASSWORD=zentrasec_secure
      - POSTGRES_DB=zentrasec_events
    ports:
      - "5432:5432"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
